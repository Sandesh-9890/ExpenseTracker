<html>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="./dashboard.css">

</head>

<body>

    <div class="container">

        <!-- Heading -->

        <header>

            <h1>Expense Tracker</h1>

            <p>Manage your income and expenses</p>

        </header>


        <!-- Summary -->

        <section class="summary">

            <div class="summary-card">

                <h3>Total Income</h3>

                <p id="totalIncome">₹0</p>

            </div>


            <div class="summary-card">

                <h3>Total Expense</h3>

                <p id="totalExpense">₹0</p>

            </div>


            <div class="summary-card">

                <h3>Balance</h3>

                <p id="balance">₹0</p>

            </div>

        </section>


        <!-- Add Transaction -->

        <section class="transaction-form">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">

                    <label for="title">Title</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="type">Type</label>

                    <select id="type">

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="category">Category</label>

                    <select id="category">

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">Date</label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- Search and Filter -->

        <section class="controls">

            <div>

                <label for="search">
                    Search
                </label>

                <input
                    type="text"
                    id="search"
                    placeholder="Search transaction..."
                >

            </div>


            <div>

                <label for="filterType">
                    Filter
                </label>

                <select id="filterType">

                    <option value="all">
                        All
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>

            </div>


            <div>

                <label for="filterCategory">
                    Category
                </label>

                <select id="filterCategory">

                    <option value="all">
                        All
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label for="sort">
                    Sort
                </label>

                <select id="sort">

                    <option value="none">
                        None
                    </option>

                    <option value="amountAsc">
                        Amount Low → High
                    </option>

                    <option value="amountDesc">
                        Amount High → Low
                    </option>

                    <option value="dateAsc">
                        Date Old → New
                    </option>

                    <option value="dateDesc">
                        Date New → Old
                    </option>

                </select>

            </div>

        </section>


        <!-- Transactions -->

        <section class="transactions">

            <h2>Transactions</h2>

            <div id="transactionList">

                <!-- Transactions will be inserted here using JavaScript -->

            </div>

        </section>


        <!-- Chart -->

        <section class="chart-section">

            <h2>Expense by Category</h2>

            <canvas id="expenseChart"></canvas>

        </section>


    </div>
    <div class="chatbot">

    <h2>🤖 AI Assistant</h2>

    <div id="chatMessages"></div>

    <div class="chat-input">
        <input 
            type="text" 
            id="userMessage"
            placeholder="Ask something..."
        >

        <button id="sendButton">
            Send
        </button>
    </div>

</div>


    <script src="./dashboard.js"></script>

</body>

</html>
